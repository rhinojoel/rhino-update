<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rhino | New website</title>
  <meta name="description" content="A starting point for the new Rhino website.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Rhino</a>
    <nav aria-label="Main">
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Your headline goes here</h1>
      <p>A short, plain English line that says what you do and who it's for.</p>
      <a class="button" href="#contact">Get in touch</a>
    </section>

    <section id="about" class="section">
      <h2>About</h2>
      <p>Add your main content here.</p>
    </section>

    <section id="contact" class="section">
      <h2>Contact</h2>
      <p>Add contact details or a form here.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Rhino. All rights reserved.</p>
  </footer>
</body>
</html>
